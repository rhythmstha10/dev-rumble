<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CampusHub AI{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{
    --ink-navy:#1C2541;
    --deep-navy:#0B132B;
    --parchment:#F7F5F0;
    --brass:#B08D57;
    --stacks-green:#3E5C50;
    --ink-grey:#3A3F4B;
    --danger:#9B3B3B;
  }
  body{
    background:var(--deep-navy);
    color:var(--ink-grey);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Fraunces',serif; color:var(--deep-navy); }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .brand-strip{ padding:1.4rem 2rem; }
  .brand-strip a{
    font-family:'Fraunces',serif;
    color:var(--parchment);
    font-weight:700;
    font-size:1.25rem;
    text-decoration:none;
  }
  .brand-strip a span{ color:var(--brass); }
  .auth-wrap{
    position:relative;
    min-height:calc(100vh - 76px);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:2rem;
  }
  .auth-wrap::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:repeating-linear-gradient(
      to bottom,
      rgba(176,141,87,0.06) 0px,
      rgba(176,141,87,0.06) 1px,
      transparent 1px,
      transparent 64px
    );
  }
  .auth-card{
    background:var(--parchment);
    border-radius:5px;
    width:100%;
    max-width:420px;
    padding:2.2rem 2.2rem 1.8rem;
    box-shadow:0 24px 60px rgba(0,0,0,0.45);
    position:relative;
    z-index:1;
  }
  .auth-card::before{
    content:"CAMPUSHUB AI";
    position:absolute;
    top:.7rem; right:.9rem;
    font-family:'IBM Plex Mono',monospace;
    font-size:.6rem;
    letter-spacing:.1em;
    color:var(--stacks-green);
    border:1px solid var(--stacks-green);
    padding:.15rem .4rem;
    border-radius:3px;
  }
  .form-label{
    font-size:.8rem;
    font-weight:600;
    color:var(--deep-navy);
    letter-spacing:.02em;
  }
  .form-control, .form-select{
    border:1px solid rgba(28,37,65,0.18);
    border-radius:4px;
    padding:.55rem .8rem;
    font-size:.92rem;
  }
  .form-control:focus, .form-select:focus{
    border-color:var(--brass);
    box-shadow:0 0 0 3px rgba(176,141,87,0.18);
  }
  .btn-brass{
    background:var(--brass);
    color:var(--deep-navy);
    font-weight:600;
    border:none;
    padding:.6rem 1.4rem;
    width:100%;
  }
  .btn-brass:hover{ background:#c49f6b; color:var(--deep-navy); }
  .auth-footnote{
    font-size:.78rem;
    color:#8b93a3;
    text-align:center;
    margin-top:1rem;
  }
  .auth-footnote a{ color:var(--stacks-green); font-weight:600; text-decoration:none; cursor:pointer; }
  .errorlist{
    display:block;
    font-size:.8rem;
    color:var(--danger);
    background:rgba(155,59,59,0.08);
    border:1px solid rgba(155,59,59,0.25);
    border-radius:4px;
    padding:.5rem .7rem;
    margin-bottom:1rem;
    list-style:none;
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

<div class="brand-strip">
  <a href="{% url 'login-page' %}">CampusHub <span>AI</span></a>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    {% block content %}{% endblock %}
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
